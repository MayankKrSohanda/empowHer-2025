<div class="container mt-4">
  <h2>Add Product</h2>

  <form (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <div class="form-group mb-3">
      <input type="text" [(ngModel)]="product.title" name="title" placeholder="Title" class="form-control" required>
    </div>
    Description:
    <div class="form-group mb-3">
      <input type="text" [(ngModel)]="product.description" name="description" placeholder="Description" class="form-control">
    </div>
    Quantity:
    <div class="form-group mb-3">
      <input type="number" [(ngModel)]="product.quantity" name="quantity" placeholder="Quantity" class="form-control" required>
    </div>
    Price:
    <div class="form-group mb-3">
      <input type="number" [(ngModel)]="product.price" name="price" placeholder="Price" class="form-control" required>
    </div>

    <div class="form-group mb-3">
      <select [(ngModel)]="product.categoryId" name="categoryId" class="form-select" required>
         <option value="">All Categories</option>
          <option *ngFor="let cat of categories" [value]="cat.id">
            {{ cat.name }}
          </option>
      </select>
    </div>
 
    <div class="form-group mb-3">
      <label>Upload Product Image</label>
      <input type="file" (change)="onFileSelected($event)" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary me-2">Save</button>
    <button routerLink="/admin/products" type="button" class="btn btn-secondary">Cancel</button>
  </form>
</div>
