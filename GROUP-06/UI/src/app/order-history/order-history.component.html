<div class="container mt-4">
  <h3 class="mb-4 text-primary">Your Order History</h3>

  <div *ngIf="orders.length === 0" class="alert alert-info">
    You have no orders yet.
  </div>
    <!-- //<button routerLink="/customer/home" background-color="blue">back</button>  -->

  <div class="row">
    <div *ngFor="let order of orders" class="col-md-6 col-lg-4 mb-4">
      <div class="card h-100 border-primary shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
          <div>Order #{{ order.orderId }} <br> {{ order.date | date:'shortDate' }}</div>
          <span class="badge bg-light text-primary">{{ order.status }}</span>
        </div>
        <div class="card-body d-flex flex-column">
          <ul class="list-group mb-3">
            <li *ngFor="let item of order.items" class="list-group-item d-flex justify-content-between align-items-center">
              {{ item.title }} (x{{ item.quantity }})
              <span>${{ item.price * item.quantity }}</span>
            </li>
          </ul>
          <h5 class="mt-auto text-end text-primary">Total: ${{ order.totalAmount }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
