<div 
  class="card-body d-flex flex-column align-items-center"
  style="
    cursor: pointer;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    transition: all 0.3s ease-in-out;
  "
  (click)="viewDetailsEvent()"
  onmouseover="this.style.boxShadow='0 8px 20px rgba(0,0,0,0.15)'"
  onmouseout="this.style.boxShadow='0 4px 8px rgba(0,0,0,0.08)'"
>
  <img 
    [src]="product.imageUrl ? 'http://localhost:8080' + product.imageUrl : 'assets/default-image.jpg'"
    alt="{{ product.title }}"
    class="product-image mb-3"
    style="height: 200px; object-fit: cover; border-radius: 8px;"
  >

  <div class="text-center">
    <h5 class="card-title text-primary">{{ product.title }}</h5>
    <p class="card-text text-muted">{{ product.description }}</p>
    
    <div class="mt-auto">
      <p class="card-text"><strong class="text-success">${{ product.price }}</strong></p>
      <button 
        class="btn btn-outline-primary btn-block"
        (click)="$event.stopPropagation(); onAddToCart(product)"
      >
        🛒 Add to Cart
      </button>
    </div>
  </div>
</div>
