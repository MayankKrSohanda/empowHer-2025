<div class="product-details-container container my-5">

  <!-- Loader -->
  <h1 class="mb-4 text-center">PRODUCT DETAILS</h1>
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Product Details -->
  <div *ngIf="!isLoading && product" class="row">
    <!-- Product Image -->
    <!-- <div class="col-md-6 text-center">
      <img 
        [src]="" 
        [alt]="product.title" 
        class="img-fluid rounded shadow-sm"
        style="max-height: 400px; object-fit: cover;"
      />
    </div> -->

    <!-- Product Info -->
    <div class="col-md-6">
      <h2>{{ product.title }}</h2>
      <p class="text-muted mb-3">{{ product.category }}</p>
      <h4 class="text-primary mb-3">₹{{ product.price }}</h4>
      <p class="mb-4">{{ product.description }}</p>

      <!-- Buttons -->
      <div class="d-flex gap-3">
        <button class="btn btn-action" (click)="addToCart(product)">
          Add to Cart
        </button>
        <button class="btn btn-action" (click)="goBack()">
          Back to Products
        </button>
      </div>
    </div>
  </div>

  <!-- Error if no product found -->
  <div *ngIf="!isLoading && !product" class="text-center py-5">
    <h5 class="text-danger">Product not found!</h5>
    <button class="btn btn-action mt-3" (click)="goBack()">Back to Products</button>
  </div>

</div>
