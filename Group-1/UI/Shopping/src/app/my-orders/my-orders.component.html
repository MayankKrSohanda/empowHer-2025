
<div class="container my-orders py-4">
  <h2 class="mb-4">My Orders</h2>
  <div *ngIf="orders.length === 0" class="alert alert-info">
    No orders found. Start shopping now!
  </div>
  <div class="row gy-4">
    <div *ngFor="let order of orders" class="col-md-6">
      <div class="card shadow-sm h-100 border-primary">
        <div class="card-header bg-primary text-white">
          <div class="d-flex justify-content-between align-items-center">
            <span>Order #{{ order.orderId }}</span>
            <span class="badge bg-info">Completed</span>
          </div>
        </div>
        <div class="card-body">
          <div class="mb-2">
            <small class="text-muted">Placed on:</small>
            <span>{{ order.orderDate | date:'mediumDate' }}</span>
          </div>
          <div class="mb-2">
            <small class="text-muted">Delivery Address:</small>
            <span>{{ order.deliveryAddress }}</span>
          </div>
          <div class="mb-3">
            <strong>Total:</strong> <span class="text-success">₹{{ order.totalAmount }}</span>
          </div>
          <hr />
        
        </div>
        <div class="card-footer bg-light">
          <button class="btn btn-outline-secondary btn-sm">View Details</button>
        </div>
      </div>
    </div>
  </div>
</div>
