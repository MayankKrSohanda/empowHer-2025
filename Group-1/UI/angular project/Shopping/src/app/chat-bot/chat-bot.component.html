<div class="chat-container text-dark input-group mb-3">
    <div class="messages form-control ">
     <div *ngFor="let msg of messages" [ngClass]="msg.sender" class="bot-reply">
  {{ msg.text }}
</div>
    </div>

  <div class="input-group mb-3">
    <input [(ngModel)]="userInput" class="form-control" (keyup.enter)="sendMessage()" placeholder="Ask me something..." />
    <button type="button" (click)="sendMessage()" class="btn btn-primary">Enter</button>
  </div>
</div>
