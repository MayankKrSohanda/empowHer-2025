<div class="container my-5 text-center">
  <div class="card shadow-lg border-0 mx-auto" style="max-width: 500px">
    <div class="card-body">
      <h2 class="text-success">
        <i class="bi bi-check-circle-fill me-2"></i>Payment Successful!
      </h2>
      <p class="mt-3">
        Your order <strong>#{{ orderId }}</strong> has been placed.
      </p>
      <p>
        Total Paid: <strong>${{ amount }}</strong>
      </p>
      <button class="btn btn-primary mt-3" (click)="goToOrders()">
  View My Orders
</button>

    </div>
  </div>
</div>
