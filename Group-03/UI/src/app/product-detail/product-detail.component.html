<div class="container mt-5" *ngIf="product">
  <!-- ADD THIS near top of product-detail.component.html (inside top-level container, e.g. just under <div class="container..."> ) -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
  <div
    *ngIf="showingToast"
    class="toast show align-items-center text-white border-0 shadow-lg product-toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    [ngClass]="{
      'bg-success': toastType === 'success',
      'bg-danger': toastType === 'danger',
      'bg-info': toastType === 'info'
    }"
  >
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi" [ngClass]="{
          'bi-check-circle-fill': toastType === 'success',
          'bi-exclamation-octagon-fill': toastType === 'danger',
          'bi-info-circle-fill': toastType === 'info'
        }"></i>
        <div class="toast-text">{{ toastMessage }}</div>
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Close"
        (click)="hideToast()"
      ></button>
    </div>
  </div>
</div>

  <div class="row g-4 align-items-start">
    <!-- Product Images -->
    <div class="col-md-6 text-center">
      <div class="product-image-wrapper position-relative">
        <img
          [src]="currentImageUrl()"
          class="product-image img-fluid rounded"
          alt="{{ product.title }}"
        />

        <!-- Prev button -->
        <button
          *ngIf="hasMultipleImages()"
          class="btn btn-secondary position-absolute top-50 start-0 translate-middle-y"
          (click)="prevImage()"
          type="button"
        >
          <i class="bi bi-chevron-left"></i>
        </button>

        <!-- Next button -->
        <button
          *ngIf="hasMultipleImages()"
          class="btn btn-secondary position-absolute top-50 end-0 translate-middle-y"
          (click)="nextImage()"
          type="button"
        >
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- Product Info -->
    <div class="col-md-6">
      <h2 class="product-title">{{ product.title }}</h2>
      <div class="title-divider"></div>
      <p class="product-description">{{ product.description }}</p>
      <h3 class="product-price">₹ {{ product.price }}</h3>

      <p>
        <span
          [ngClass]="
            product.isActive && product.quantity > 0
              ? 'badge bg-success px-3 py-2'
              : 'badge bg-danger px-3 py-2'
          "
        >
          {{
            product.isActive && product.quantity > 0
              ? "In Stock"
              : "Out of Stock"
          }}
        </span>
      </p>

      <div *ngIf="product.isActive && product.quantity > 0; else noStock">
        <div class="d-flex align-items-center gap-3 mt-3">
          <div>
            <label for="quantity" class="form-label fw-semibold"
              >Quantity:</label
            >
            <select
              id="quantity"
              class="form-select quantity-dropdown"
              [(ngModel)]="selectedQuantity"
              [disabled]="quantityOptions.length === 0"
            >
              <option
                *ngFor="let qty of quantityOptions"
                [ngValue]="qty"
              >
                {{ qty }}
              </option>
            </select>
          </div>

          <button
            class="btn primary-cta btn-lg shadow-sm px-4"
            (click)="onAddToCart(product)"
            [disabled]="!canAddToCart()"
            type="button"
          >
            <i class="bi bi-cart-plus me-2"></i> Add to Cart
          </button>
        </div>
      </div>

      <ng-template #noStock>
        <p class="text-danger fw-bold mt-3 fs-5">Currently Unavailable</p>
      </ng-template>
    </div>
  </div>
</div>
