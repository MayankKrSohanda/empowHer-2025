<div
  class="card h-100 shadow-lg p-3 mb-5 bg-body rounded card-sm card-hover-lift"
  (click)="onViewDetails($event, product.id!)"
>
  <!-- Display only the first image -->
  <img
    class="card-img-top product-img"
    [src]="
      product.productImg.length > 0
        ? product.productImg[0].url
        : 'assets/no-image.png'
    "
    [alt]="product.title"
  />

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.title }}</h5>
    <p class="card-text flex-grow-1">{{ product.description }}</p>
    <p
      [ngClass]="
        product.isActive && product.quantity > 0
          ? 'text-success fw-bold'
          : 'text-danger fw-bold'
      "
    >
      {{
        product.isActive && product.quantity > 0 ? "In Stock" : "Out of Stock"
      }}
    </p>

    <div class="mt-auto" (click)="$event.stopPropagation()">
      <p class="card-text">
        <strong>${{ product.price }}</strong>
      </p>
      
      <button
        class="btn btn-primary w-100 btn-block"
        (click)="onAddToCart(product, $event)"
        [disabled]="isAddToCartDisabled()"
      >
        Add to Cart
      </button>
    </div>
  </div>
</div>
