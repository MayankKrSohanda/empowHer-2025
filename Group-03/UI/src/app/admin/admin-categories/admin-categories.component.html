<div class="container my-4">
  <h3 class="text-primary mb-3">Manage Categories</h3>

  <!-- Add Category Form -->
  <form [formGroup]="categoryForm" class="mb-3 d-flex gap-2">
    <input type="text" class="form-control" placeholder="Category Name" formControlName="categoryName">
    <button type="button" class="btn btn-primary" (click)="addCategory()">
      {{ editingCategory ? 'Update' : 'Add' }}
    </button>
  </form>

  <!-- Categories Table -->
  <div *ngIf="categories.length > 0" class="table-responsive shadow rounded-4 border">
    <table class="table table-hover align-middle mb-0 bg-white text-center">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Category Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ cat.categoryName }}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" (click)="confirmDelete(cat)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="categories.length === 0" class="text-center my-5">
    <i class="bi bi-exclamation-circle fs-2 text-muted"></i>
    <p class="text-muted mt-2">No categories found.</p>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete category "<strong>{{ categoryToDelete?.categoryName }}</strong>"?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteCategory(categoryToDelete!)">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
  <div class="toast align-items-center text-white bg-primary border-0" role="alert" *ngIf="showingToast">
    <div class="d-flex">
      <div class="toast-body">{{ toastMessage }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="showingToast=false"></button>
    </div>
  </div>
</div>
