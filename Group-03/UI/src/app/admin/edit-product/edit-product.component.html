<div class="container my-4">
  <div class="card shadow-lg rounded-4 p-4 edit-product-card position-relative">
    <i 
    class="bi bi-x-lg position-absolute top-0 end-0 m-3 text-danger cursor-pointer"
    (click)="goToAdminHome()"
    title="Go Back"
    style="font-size: 1.5rem;"
  ></i>
    <h3 class="card-title mb-4 text-center text-primary">Edit Product</h3>

    <!-- Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div
        id="editToast"
        class="toast align-items-center text-white border-0"
        [ngClass]="{
          'bg-success': toastType === 'success',
          'bg-danger': toastType === 'danger'
        }"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body">
            <i
              class="bi me-2"
              [ngClass]="{
                'bi-check-circle-fill': toastType === 'success',
                'bi-x-circle-fill': toastType === 'danger'
              }"
            ></i>
            {{ toastMsg }}
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <form *ngIf="editedProduct" #editForm="ngForm" (ngSubmit)="saveChanges()" novalidate>
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label">Product Title</label>
        <input
          type="text"
          id="title"
          class="form-control rounded-pill"
          [(ngModel)]="editedProduct.title"
          name="title"
          required
        />
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          class="form-control rounded"
          [(ngModel)]="editedProduct.description"
          name="description"
          rows="3"
        ></textarea>
      </div>

      <!-- Category -->
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select
          id="category"
          class="form-select rounded-pill"
          [(ngModel)]="editedProduct.categoryId"
          name="categoryId"
          required
        >
          <option *ngFor="let cat of categories" [value]="cat.categoryId">
            {{ cat.categoryName }}
          </option>
        </select>
      </div>

      <!-- Price & Quantity -->
      <div class="row mb-3">
        <div class="col">
          <label for="price" class="form-label">Price</label>
          <input
            type="number"
            id="price"
            class="form-control rounded-pill"
            [(ngModel)]="editedProduct.price"
            name="price"
            min="0"
            required
          />
        </div>
        <div class="col">
          <label for="quantity" class="form-label">Quantity</label>
          <input
            type="number"
            id="quantity"
            class="form-control rounded-pill"
            [(ngModel)]="editedProduct.quantity"
            name="quantity"
            min="0"
            required
          />
        </div>
      </div>

      <!-- Active toggle -->
      <div class="form-check form-switch mb-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="isActive"
          [(ngModel)]="editedProduct.isActive"
          name="isActive"
          
        />
        <label class="form-check-label" for="isActive">{{
          editedProduct.isActive ? "Active" : "Inactive"
        }}</label>
      </div>

      <!-- Image Upload -->
      <div class="mb-3">
        <label class="form-label">Product Images</label>
        <input
          type="file"
          class="form-control"
          (change)="onFileSelected($event)"
          multiple
        />
      </div>

      <!-- Image Previews -->
      <div class="mb-3 d-flex flex-wrap gap-2">
        <!-- Existing images -->
        <div
          class="image-preview position-relative"
          *ngFor="let img of editedProduct.productImg; let i = index"
        >
          <img [src]="img.url" alt="existing image" />
          <button
            type="button"
            class="btn-close position-absolute top-0 end-0"
            (click)="removeExistingImage(i)"
          ></button>
        </div>

        <!-- New images -->
        <div
          class="image-preview position-relative"
          *ngFor="let file of selectedFiles; let i = index"
        >
          <img [src]="getFileUrl(file)" alt="preview" />
          <button
            type="button"
            class="btn-close position-absolute top-0 end-0"
            (click)="removeFile(i)"
          ></button>
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-success rounded-pill px-4">
          Save Changes
        </button>
        <button
          type="button"
          class="btn btn-secondary rounded-pill px-4"
          (click)="resetForm()"
        >
          Reset
        </button>
      </div>
    </form>
  </div>
</div>
