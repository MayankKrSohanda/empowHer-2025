<!-- Cart container -->
<div class="container my-5">
  <!-- Cart Title -->
  <h2 class="fw-bold mb-4 text-primary">
    <i class="bi bi-cart-check-fill me-2"></i> Shopping Cart
  </h2>

  <!-- If cart has items -->
  <div *ngIf="cartItems.length > 0; else emptyCart">
    <div class="card shadow-lg border-0">
      <div class="card-body p-0">
        <!-- Table -->
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Price</th>
              <th scope="col" class="col-qty">Quantity</th>
              <th scope="col">Total</th>
              <th scope="col" class="text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of cartItems" class="cart-row">
              <!-- Product info -->
              <td>
                <div class="d-flex align-items-center">
                  <div class="cart-img-wrapper">
                    <img
                      [src]="getProductImage(item)"
                      alt="{{ item.productTitle }}"
                      class="cart-img"
                    />
                  </div>
                  <div class="ms-3">
                    <h6 class="mb-1">{{ item.productTitle }}</h6>
                  </div>
                </div>
              </td>

              <!-- Price -->
              <td>₹ {{ item.productPrice }}</td>

              <!-- Quantity -->
              <td>
                <div class="d-flex align-items-center">
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    (click)="decreaseQuantity(item)"
                    [disabled]="item.quantity <= 1"
                  >
                    <i class="bi bi-dash"></i>
                  </button>
                  <input
                    type="text"
                    class="form-control text-center mx-1 qty-input"
                    [value]="item.quantity || 1"
                    readonly
                  />
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    (click)="increaseQuantity(item)"
                    [disabled]="item.quantity >= item.prodAvailQuantity"
                  >
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </td>

              <!-- Total -->
              <td class="fw-bold text-success">
                ₹ {{ item.productPrice * (item.quantity || 1) }}
              </td>

              <!-- Remove -->
              <td class="text-center">
                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="removeItem(item.id)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Cart Summary -->
      <div
        class="card-footer d-flex flex-wrap justify-content-between align-items-center bg-light"
      >
        <div class="mb-2 mb-md-0">
          <button class="btn btn-outline-danger me-2" (click)="clearCart()">
            <i class="bi bi-x-circle me-1"></i> Clear Cart
          </button>
          <button
            class="btn btn-outline-secondary"
            (click)="continueShopping()"
          >
            <i class="bi bi-arrow-left me-1"></i> Continue Shopping
          </button>
        </div>

        <div class="text-end">
          <h5 class="mb-2">
            Total: <span class="text-success fw-bold">₹ {{ getTotal() }}</span>
          </h5>
          <button
            class="btn btn-primary btn-lg px-4 fw-bold"
            (click)="checkout()"
          >
            <i class="bi bi-box-arrow-in-right me-2"></i> Proceed to Checkout
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty Cart -->
  <ng-template #emptyCart>
    <div class="alert alert-info text-center py-4">
      <i class="bi bi-bag-x fs-3 d-block mb-2"></i>
      Your cart is empty.
    </div>
  </ng-template>
</div>

<!-- Toast Notification -->
<div
  *ngIf="toastMessage"
  class="toast-container position-fixed top-0 end-0 p-3"
  style="z-index: 20000;"
>
  <div class="toast show align-items-center text-bg-danger border-0 shadow" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-semibold">
        {{ toastMessage }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastMessage = ''"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
